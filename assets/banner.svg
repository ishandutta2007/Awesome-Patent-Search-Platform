<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .glow-orbit {
        animation: rotateOrb 20s linear infinite;
        transform-origin: 600px 210px;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .beam-pulse {
        animation: dash 4s linear infinite;
      }
      @keyframes rotateOrb {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Matrix / Circuit Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Glowing Background Orbs -->
  <circle cx="250" cy="180" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-node" />
  <circle cx="950" cy="230" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="pulse-node" style="animation-delay: 1.5s;" />

  <!-- Patent Citation Network Constellation Background -->
  <g class="glow-orbit" stroke="#0ea5e9" stroke-width="1.5" opacity="0.35" stroke-dasharray="6,6">
    <circle cx="600" cy="210" r="180" fill="none" />
    <circle cx="600" cy="210" r="280" fill="none" stroke="#8b5cf6" opacity="0.25" />
  </g>

  <!-- Network Nodes & Citations (Decorative Intellectual Property graph) -->
  <g opacity="0.6">
    <line x1="160" y1="120" x2="280" y2="220" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="280" y1="220" x2="200" y2="320" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="280" y1="220" x2="400" y2="240" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="160" cy="120" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="280" cy="220" r="7" fill="#818cf8" filter="url(#glow)" />
    <circle cx="200" cy="320" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="400" cy="240" r="5" fill="#c084fc" filter="url(#glow)" />

    <line x1="1040" y1="120" x2="920" y2="200" stroke="#c084fc" stroke-width="1.5" />
    <line x1="920" y1="200" x2="1000" y2="300" stroke="#818cf8" stroke-width="1.5" />
    <line x1="920" y1="200" x2="800" y2="210" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="1040" cy="120" r="6" fill="#c084fc" filter="url(#glow)" />
    <circle cx="920" cy="200" r="8" fill="#ec4899" filter="url(#glow)" />
    <circle cx="1000" cy="300" r="5" fill="#818cf8" filter="url(#glow)" />
    <circle cx="800" cy="210" r="6" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Badge / Tagline pill -->
  <g transform="translate(420, 65)">
    <rect width="360" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="180" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      ⚡ THE DEFINITIVE IP &amp; PATENT DIRECTORY
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="175" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Patent Search Platform
  </text>

  <!-- Subtitle -->
  <text x="600" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    Curated Ecosystem of SaaS Intelligence Tools &amp; Open-Source Patent Infrastructure
  </text>

  <!-- Feature Pills -->
  <g transform="translate(240, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔍 Prior-Art Search</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(185, 0)">
      <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="24" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 IP Landscaping</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="24" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🤖 AI &amp; Semantic NLP</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(570, 0)">
      <rect width="150" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="24" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Global Datasets</text>
    </g>
  </g>

  <!-- Footer Stats / Status line -->
  <text x="600" y="365" fill="#64748b" font-family="sans-serif" font-size="13" text-anchor="middle">
    ⭐ 40+ Open-Source Repositories • 💼 23 Top SaaS Platforms • 📡 Real-time Star Tracker
  </text>
</svg>
